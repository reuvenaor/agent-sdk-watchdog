name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit signatures

  sdk-range:
    name: SDK ${{ matrix.sdk }}
    # Type-checks and tests against the low end, the last version before the post-result wait, and a recent one.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.3.280', '0.3.283', '0.3.293']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the SDK version
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          npm install --no-save "@anthropic-ai/claude-agent-sdk@$SDK"
          npm ls @anthropic-ai/claude-agent-sdk
      - run: npm run typecheck
      - run: npm test

  ci-ok:
    name: ci-ok
    # The one check the main branch ruleset requires.
    if: always()
    needs: [verify, sdk-range]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a job ended with: $result"
              exit 1
            fi
          done
