version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    # The SDK peer range is a deliberate decision; see the README.
    ignore:
      - dependency-name: '@anthropic-ai/claude-agent-sdk'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
